name: Continue offline checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reader and plugin tests, frontend syntax, private scan, proof gate, ZIP readback
        run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium for rail proportion regression
        run: python -m playwright install --with-deps chromium
      - name: Run offline checks
        run: python tools/local_ci.py
